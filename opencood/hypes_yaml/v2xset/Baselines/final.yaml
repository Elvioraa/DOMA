name: V2XSET_BASELINES_SEED303_final
root_dir: dataset/V2XSET/train
validate_dir: dataset/V2XSET/validate
test_dir: dataset/V2XSET/test
yaml_parser: load_general_params
train_params:
  batch_size: 16
  epoches: 30
  eval_freq: 2
  save_freq: 2
  max_cav: 5
  run_inference_after_training: false
comm_range: 180
input_source:
- lidar
- camera
label_type: lidar
cav_lidar_range: &id001
- -204.8
- -102.4
- -3
- 204.8
- 102.4
- 1
heter:
  assignment_path: opencood/logs/heter_modality_assign/v2xset_4modality_in_order.json
  ego_modality: m1
  mapping_dict:
    m1: m1
    m2: m2
    m3: m3
    m4: m4
  modality_setting:
    m1:
      sensor_type: lidar
      core_method: point_pillar
      preprocess:
        core_method: SpVoxelPreprocessor
        args:
          voxel_size:
          - 0.4
          - 0.4
          - 4
          max_points_per_voxel: 32
          max_voxel_train: 32000
          max_voxel_test: 70000
        cav_lidar_range: *id001
    m2:
      sensor_type: camera
      core_method: lift_splat_shoot
      grid_conf:
        xbound:
        - -48
        - 48
        - 0.4
        ybound:
        - -48
        - 48
        - 0.4
        zbound:
        - -10
        - 10
        - 20.0
        ddiscr:
        - 2
        - 50
        - 48
        mode: LID
      data_aug_conf:
        resize_lim:
        - 0.65
        - 0.7
        final_dim:
        - 384
        - 512
        rot_lim:
        - -3.6
        - 3.6
        H: 600
        W: 800
        rand_flip: false
        bot_pct_lim:
        - 0.0
        - 0.05
        cams:
        - camera0
        - camera1
        - camera2
        - camera3
        Ncams: 4
    m3:
      sensor_type: lidar
      core_method: second
      preprocess:
        core_method: SpVoxelPreprocessor
        args:
          voxel_size:
          - 0.1
          - 0.1
          - 0.1
          max_points_per_voxel: 5
          max_voxel_train: 32000
          max_voxel_test: 70000
        cav_lidar_range: *id001
    m4:
      sensor_type: camera
      core_method: lift_splat_shoot
      grid_conf:
        xbound:
        - -48
        - 48
        - 0.4
        ybound:
        - -48
        - 48
        - 0.4
        zbound:
        - -10
        - 10
        - 20.0
        ddiscr:
        - 2
        - 50
        - 48
        mode: LID
      data_aug_conf:
        resize_lim:
        - 0.56
        - 0.61
        final_dim:
        - 336
        - 448
        rot_lim:
        - -3.6
        - 3.6
        H: 600
        W: 800
        rand_flip: false
        bot_pct_lim:
        - 0.0
        - 0.05
        cams:
        - camera0
        - camera1
        - camera2
        - camera3
        Ncams: 4
  lidar_channels_dict: {}
fusion:
  core_method: lateheterbaseline
  dataset: v2xset
  args:
    proj_first: false
    grid_conf: None
    data_aug_conf: None
data_augment:
- NAME: random_world_flip
  ALONG_AXIS_LIST:
  - x
- NAME: random_world_rotation
  WORLD_ROT_ANGLE:
  - -0.78539816
  - 0.78539816
- NAME: random_world_scaling
  WORLD_SCALE_RANGE:
  - 0.95
  - 1.05
preprocess:
  core_method: SpVoxelPreprocessor
  args:
    voxel_size:
    - 0.4
    - 0.4
    - 4
    max_points_per_voxel: 1
    max_voxel_train: 1
    max_voxel_test: 1
  cav_lidar_range: *id001
postprocess:
  core_method: VoxelPostprocessor
  gt_range: *id001
  anchor_args:
    cav_lidar_range: *id001
    l: 3.9
    w: 1.6
    h: 1.56
    r: &id002
    - 0
    - 90
    feature_stride: 2
    num: 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.2
  order: hwl
  max_num: 100
  nms_thresh: 0.15
  dir_args: &id003
    dir_offset: 0.7853
    num_bins: 2
    anchor_yaw: *id002
model:
  core_method: heter_model_late
  args:
    ego_modality: m1
    lidar_range: *id001
    m1:
      core_method: point_pillar
      sensor_type: lidar
      encoder_args:
        voxel_size:
        - 0.4
        - 0.4
        - 4
        lidar_range: *id001
        pillar_vfe:
          use_norm: true
          with_distance: false
          use_absolute_xyz: true
          num_filters:
          - 64
        point_pillar_scatter:
          num_features: 64
      backbone_args:
        layer_nums:
        - 3
        layer_strides:
        - 2
        num_filters:
        - 64
      aligner_args:
        core_method: identity
      layers_args:
        layer_nums:
        - 3
        - 5
        - 8
        layer_strides:
        - 2
        - 2
        - 2
        num_filters:
        - 64
        - 128
        - 256
        upsample_strides:
        - 1
        - 2
        - 4
        num_upsample_filter:
        - 128
        - 128
        - 128
      shrink_header:
        kernal_size:
        - 3
        stride:
        - 1
        padding:
        - 1
        dim:
        - 256
        input_dim: 384
      head_args:
        in_head: 256
    anchor_number: 2
    dir_args: *id003
    m2:
      core_method: lift_splat_shoot
      sensor_type: camera
      encoder_args:
        anchor_number: 2
        grid_conf: &id004
          xbound:
          - -48
          - 48
          - 0.4
          ybound:
          - -48
          - 48
          - 0.4
          zbound:
          - -10
          - 10
          - 20.0
          ddiscr:
          - 2
          - 50
          - 48
          mode: LID
        data_aug_conf:
          resize_lim:
          - 0.65
          - 0.7
          final_dim:
          - 384
          - 512
          rot_lim:
          - -3.6
          - 3.6
          H: 600
          W: 800
          rand_flip: false
          bot_pct_lim:
          - 0.0
          - 0.05
          cams:
          - camera0
          - camera1
          - camera2
          - camera3
          Ncams: 4
        img_downsample: 8
        img_features: 128
        use_depth_gt: false
        depth_supervision: false
        camera_encoder: EfficientNet
      camera_mask_args:
        cav_lidar_range: *id001
        grid_conf: *id004
      backbone_args:
        layer_nums:
        - 3
        layer_strides:
        - 2
        num_filters:
        - 64
        inplanes: 128
      aligner_args:
        core_method: identity
      layers_args:
        layer_nums:
        - 3
        - 5
        - 8
        layer_strides:
        - 2
        - 2
        - 2
        num_filters:
        - 64
        - 128
        - 256
        upsample_strides:
        - 1
        - 2
        - 4
        num_upsample_filter:
        - 128
        - 128
        - 128
      shrink_header:
        kernal_size:
        - 3
        stride:
        - 1
        padding:
        - 1
        dim:
        - 256
        input_dim: 384
      head_args:
        in_head: 256
    m3:
      core_method: second
      sensor_type: lidar
      encoder_args:
        voxel_size:
        - 0.1
        - 0.1
        - 0.1
        lidar_range: *id001
        mean_vfe:
          num_point_features: 4
        spconv:
          num_features_in: 4
          num_features_out: 64
        map2bev:
          feature_num: 128
      backbone_args:
        layer_nums:
        - 3
        layer_strides:
        - 1
        num_filters:
        - 64
        inplanes: 128
      aligner_args:
        core_method: identity
      layers_args:
        layer_nums:
        - 3
        - 5
        - 8
        layer_strides:
        - 1
        - 2
        - 2
        num_filters:
        - 64
        - 128
        - 256
        upsample_strides:
        - 1
        - 2
        - 4
        num_upsample_filter:
        - 128
        - 128
        - 128
      shrink_header:
        kernal_size:
        - 3
        stride:
        - 1
        padding:
        - 1
        dim:
        - 256
        input_dim: 384
      head_args:
        in_head: 256
    m4:
      core_method: lift_splat_shoot
      sensor_type: camera
      encoder_args:
        anchor_number: 2
        grid_conf: &id005
          xbound:
          - -48
          - 48
          - 0.4
          ybound:
          - -48
          - 48
          - 0.4
          zbound:
          - -10
          - 10
          - 20.0
          ddiscr:
          - 2
          - 50
          - 48
          mode: LID
        data_aug_conf:
          resize_lim:
          - 0.56
          - 0.61
          final_dim:
          - 336
          - 448
          rot_lim:
          - -3.6
          - 3.6
          H: 600
          W: 800
          rand_flip: false
          bot_pct_lim:
          - 0.0
          - 0.05
          cams:
          - camera0
          - camera1
          - camera2
          - camera3
          Ncams: 4
        img_downsample: 8
        img_features: 128
        use_depth_gt: false
        depth_supervision: false
        camera_encoder: Resnet101
      camera_mask_args:
        cav_lidar_range: *id001
        grid_conf: *id005
      backbone_args:
        layer_nums:
        - 3
        layer_strides:
        - 2
        num_filters:
        - 64
        inplanes: 128
      aligner_args:
        core_method: identity
      layers_args:
        layer_nums:
        - 3
        - 5
        - 8
        layer_strides:
        - 2
        - 2
        - 2
        num_filters:
        - 64
        - 128
        - 256
        upsample_strides:
        - 1
        - 2
        - 4
        num_upsample_filter:
        - 128
        - 128
        - 128
      shrink_header:
        kernal_size:
        - 3
        stride:
        - 1
        padding:
        - 1
        dim:
        - 256
        input_dim: 384
      head_args:
        in_head: 256
loss:
  core_method: point_pillar_depth_loss
  args:
    pos_cls_weight: 2.0
    cls:
      type: SigmoidFocalLoss
      alpha: 0.25
      gamma: 2.0
      weight: 1.0
    reg:
      type: WeightedSmoothL1Loss
      sigma: 3.0
      codewise: true
      weight: 2.0
    dir:
      type: WeightedSoftmaxClassificationLoss
      weight: 0.2
      args: *id003
    depth:
      weight: 1.0
optimizer:
  core_method: Adam
  lr: 0.002
  args:
    eps: 1e-10
    weight_decay: 1e-4
lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size:
  - 10
  - 25
seed: 303
v2xset_camera_compatible: true
baseline_protocol:
  output_dir: opencood/logs/V2XSET_BASELINES_SEED303/final_infer
  range: 204.8,102.4
  gt: all_in_range_members_lidar_in_ego
  use_cav:
  - 1
  - 2
  - 3
  - 4
