# DAIR-only protocol. Base decay=1e-4; DOMA decay=0 (existing V2R2 method).
name: DAIR_HEAL_E3_stage2_m2_seed303
data_dir: dataset/my_dair_v2x/v2x_c/cooperative-vehicle-infrastructure
root_dir: dataset/my_dair_v2x/v2x_c/cooperative-vehicle-infrastructure/train.json
validate_dir: dataset/my_dair_v2x/v2x_c/cooperative-vehicle-infrastructure/val.json
test_dir: dataset/my_dair_v2x/v2x_c/cooperative-vehicle-infrastructure/val.json
yaml_parser: load_general_params
train_params:
  batch_size: 2
  epoches: 30
  eval_freq: 2
  save_freq: 2
  max_cav: 2
  ddp_safe_validation:
    enabled: true
  run_inference_after_training: false
comm_range: 100
input_source:
- camera
- lidar
label_type: camera
cav_lidar_range: &id001
- -102.4
- -51.2
- -3.5
- 102.4
- 51.2
- 1.5
heter:
  assignment_path: null
  ego_modality: m2
  mapping_dict:
    m1: m2
    m2: m2
  modality_setting:
    m2:
      sensor_type: camera
      core_method: lift_splat_shoot
      grid_conf: &id003
        xbound:
        - -102.4
        - 102.4
        - 0.4
        ybound:
        - -51.2
        - 51.2
        - 0.4
        zbound:
        - -10
        - 10
        - 20.0
        ddiscr:
        - 2
        - 100
        - 98
        mode: LID
      data_aug_conf: &id004
        resize_lim:
        - 0.27
        - 0.28
        final_dim:
        - 288
        - 512
        rot_lim:
        - 0
        - 0
        H: 1080
        W: 1920
        rand_flip: false
        bot_pct_lim:
        - 0.0
        - 0.05
        cams:
        - camera0
        - camera1
        - camera2
        - camera3
        Ncams: 4
fusion:
  core_method: lateheter
  dataset: dairv2x
  args:
    proj_first: false
    grid_conf: None
    data_aug_conf: None
data_augment:
- NAME: random_world_flip
  ALONG_AXIS_LIST:
  - x
- NAME: random_world_rotation
  WORLD_ROT_ANGLE:
  - -0.78539816
  - 0.78539816
- NAME: random_world_scaling
  WORLD_SCALE_RANGE:
  - 0.95
  - 1.05
preprocess:
  core_method: SpVoxelPreprocessor
  args:
    voxel_size:
    - 0.4
    - 0.4
    - 5
    max_points_per_voxel: 1
    max_voxel_train: 1
    max_voxel_test: 1
  cav_lidar_range: *id001
postprocess:
  core_method: VoxelPostprocessor
  gt_range: *id001
  anchor_args:
    cav_lidar_range: *id001
    l: 4.5
    w: 2
    h: 1.8
    r: &id002
    - 0
    - 90
    feature_stride: 2
    num: 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.2
  order: hwl
  max_num: 100
  nms_thresh: 0.05
  dir_args: &id005
    dir_offset: 0.7853
    num_bins: 2
    anchor_yaw: *id002
model:
  core_method: heter_pyramid_single
  args:
    ego_modality: m2
    lidar_range: *id001
    fix_encoder: false
    m2:
      core_method: lift_splat_shoot
      sensor_type: camera
      encoder_args:
        anchor_number: 2
        grid_conf: *id003
        data_aug_conf: *id004
        img_downsample: 8
        img_features: 128
        use_depth_gt: false
        depth_supervision: false
        camera_encoder: Resnet101
      camera_mask_args:
        cav_lidar_range: *id001
        grid_conf: *id003
      backbone_args:
        layer_nums:
        - 3
        layer_strides:
        - 2
        num_filters:
        - 64
        inplanes: 128
      aligner_args:
        core_method: convnext
        warp_camera_bev: false
        args:
          num_of_blocks: 3
          dim: 64
          warpnet_indim: 128
    fusion_backbone:
      resnext: true
      layer_nums:
      - 3
      - 5
      - 8
      layer_strides:
      - 1
      - 2
      - 2
      num_filters:
      - 64
      - 128
      - 256
      upsample_strides:
      - 1
      - 2
      - 4
      num_upsample_filter:
      - 128
      - 128
      - 128
      anchor_number: 2
    shrink_header:
      fix: true
      kernal_size:
      - 3
      stride:
      - 1
      padding:
      - 1
      dim:
      - 256
      input_dim: 384
    in_head: 256
    anchor_number: 2
    dir_args: *id005
loss:
  core_method: point_pillar_pyramid_loss
  args:
    pos_cls_weight: 2.0
    cls:
      type: SigmoidFocalLoss
      alpha: 0.25
      gamma: 2.0
      weight: 1.0
    reg:
      type: WeightedSmoothL1Loss
      sigma: 3.0
      codewise: true
      weight: 2.0
    dir:
      type: WeightedSoftmaxClassificationLoss
      weight: 0.2
      args: *id005
    depth:
      weight: 1.0
    pyramid:
      relative_downsample:
      - 1
      - 2
      - 4
      weight:
      - 0.4
      - 0.2
      - 0.1
optimizer:
  core_method: Adam
  lr: 0.001
  args:
    eps: 1.0e-10
    weight_decay: 0.0001
lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size:
  - 15
  - 25
seed: 303
dair_protocol:
  enabled: true
  method: HEAL
  stage: stage2
  experiment: E3
  train_samples: 4811
  validation_samples: 1789
  evaluation_split: validation
  checkpoint_contract: true
