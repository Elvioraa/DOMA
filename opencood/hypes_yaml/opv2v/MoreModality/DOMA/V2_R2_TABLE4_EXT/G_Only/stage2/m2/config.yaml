# TABLE4_EXT_PROTOCOL_AUDIT: historical Row2 saved config is the fixed baseline.
# New rows only: G_C, M_C, G_Only, C_Only; no rerun of completed historical rows.
# Stage1 epochs=30; Stage2 epoches=25, historical init_epoch=1 (24 executed epochs).
# eval/save: m1=2/2, m2=1/1, m3=2/2, m4=2/2. Row3 differs: m2=2/2.
# Full DOMA: Stage2 epochs=30 and eval/save=1/1; final-result weight-selection provenance remains unverified.
# New checkpoint selection: unique validation-loss bestval, never test-AP selection.
# Physical GPUs=0,2; DDP world_size=2. See docs/DOMA_TABLE4_EXT.md for full audit.
name: DOMA_V2_R2_TABLE4_EXT_G_Only_stage2_m2
seed: 303
root_dir: dataset/OPV2V/train
validate_dir: dataset/OPV2V/validate
test_dir: dataset/OPV2V/test
yaml_parser: load_general_params
train_params:
  batch_size: 4
  epoches: 25
  eval_freq: 1
  save_freq: 1
  max_cav: 5
  ddp_safe_validation:
    enabled: true
comm_range: 70
input_source:
- camera
- depth
label_type: camera
cav_lidar_range: &id001
- -51.2
- -51.2
- -3
- 51.2
- 51.2
- 1
add_data_extension:
- bev_visibility.png
heter:
  assignment_path: opencood/logs/heter_modality_assign/opv2v_4modality.json
  ego_modality: m2
  lidar_channels_dict:
    m3: 32
  mapping_dict:
    m1: m2
    m2: m2
    m3: m2
    m4: m2
  modality_setting:
    m2:
      sensor_type: camera
      core_method: lift_splat_shoot
      grid_conf: &id003
        xbound:
        - -51.2
        - 51.2
        - 0.4
        ybound:
        - -51.2
        - 51.2
        - 0.4
        zbound:
        - -10
        - 10
        - 20.0
        ddiscr:
        - 2
        - 50
        - 48
        mode: LID
      data_aug_conf: &id004
        resize_lim:
        - 0.65
        - 0.7
        final_dim:
        - 384
        - 512
        rot_lim:
        - -3.6
        - 3.6
        H: 600
        W: 800
        rand_flip: false
        bot_pct_lim:
        - 0.0
        - 0.05
        cams:
        - camera0
        - camera1
        - camera2
        - camera3
        Ncams: 4
fusion:
  core_method: lateheter
  dataset: opv2v
  args:
    proj_first: false
    grid_conf: None
    data_aug_conf: None
data_augment:
- NAME: random_world_flip
  ALONG_AXIS_LIST:
  - x
- NAME: random_world_rotation
  WORLD_ROT_ANGLE:
  - -0.78539816
  - 0.78539816
- NAME: random_world_scaling
  WORLD_SCALE_RANGE:
  - 0.95
  - 1.05
preprocess:
  core_method: SpVoxelPreprocessor
  args:
    voxel_size:
    - 0.4
    - 0.4
    - 4
    max_points_per_voxel: 1
    max_voxel_train: 1
    max_voxel_test: 1
  cav_lidar_range: *id001
postprocess:
  core_method: VoxelPostprocessor
  gt_range: *id001
  anchor_args:
    cav_lidar_range: *id001
    l: 3.9
    w: 1.6
    h: 1.56
    r: &id002
    - 0
    - 90
    feature_stride: 2
    num: 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.2
  order: hwl
  max_num: 150
  nms_thresh: 0.15
  dir_args: &id005
    dir_offset: 0.7853
    num_bins: 2
    anchor_yaw: *id002
model:
  core_method: doma_heter_pyramid_single
  args:
    ego_modality: m2
    lidar_range: *id001
    fix_encoder: false
    m2:
      core_method: lift_splat_shoot
      sensor_type: camera
      encoder_args:
        anchor_number: 2
        grid_conf: *id003
        data_aug_conf: *id004
        img_downsample: 8
        img_features: 128
        use_depth_gt: false
        depth_supervision: true
        camera_encoder: EfficientNet
      camera_mask_args:
        cav_lidar_range: *id001
        grid_conf: *id003
      backbone_args:
        layer_nums:
        - 3
        layer_strides:
        - 2
        num_filters:
        - 64
        inplanes: 128
      aligner_args:
        core_method: convnext
        spatial_align: false
        args:
          num_of_blocks: 3
          dim: 64
    fusion_backbone:
      resnext: true
      layer_nums:
      - 3
      - 5
      - 8
      layer_strides:
      - 1
      - 2
      - 2
      num_filters:
      - 64
      - 128
      - 256
      upsample_strides:
      - 1
      - 2
      - 4
      num_upsample_filter:
      - 128
      - 128
      - 128
      anchor_number: 2
    shrink_header:
      kernal_size:
      - 3
      stride:
      - 1
      padding:
      - 1
      dim:
      - 256
      input_dim: 384
    in_head: 256
    anchor_number: 2
    dir_args: *id005
    doma:
      enabled: true
      version: v2
      ablation: true
      mode: stage2_adapt
      active_modality: m2
      object_space:
        enabled: true
        roi:
          output_size: 5
          max_train_proposals: 128
          max_infer_proposals: 64
          chunk_size: 32
          min_coverage: 0.5
      object_adapter:
        enabled: true
        type: residual_1x1
        zero_init: true
      object_encoder:
        enabled: true
        embedding_dim: 128
        hidden_channels: 64
        pooled_size: 2
      geometry:
        enabled: true
        hidden_dim: 32
      refiner:
        enabled: true
        hidden_dim: 128
        yaw_mode: sin_cos_centered
        zero_init_output: true
      multi_granularity:
        enabled: false
      quality:
        enabled: false
      consensus:
        enabled: false
        mode: uniform_geometry_mean
        fallback_to_original: true
      training_proposals:
        source: gt_jitter
        include_gt: true
        jitters_per_gt: 1
        center_xy_std_rel: 0.1
        center_z_std_rel: 0.05
        log_size_std: 0.05
        yaw_std_deg: 5.0
        max_proposals: 128
      loss:
        object_loss_weight: 0.2
        individual_loss_weight: 1.0
        consensus_loss_weight: 1.0
        quality_loss_weight: 0.0
loss:
  core_method: doma_point_pillar_pyramid_loss
  args:
    pos_cls_weight: 2.0
    cls:
      type: SigmoidFocalLoss
      alpha: 0.25
      gamma: 2.0
      weight: 1.0
    reg:
      type: WeightedSmoothL1Loss
      sigma: 3.0
      codewise: true
      weight: 2.0
    dir:
      type: WeightedSoftmaxClassificationLoss
      weight: 0.2
      args: *id005
    depth:
      weight: 1.0
    pyramid:
      relative_downsample:
      - 1
      - 2
      - 4
      weight:
      - 0.4
      - 0.2
      - 0.1
optimizer:
  core_method: Adam
  lr: 0.0012
  args:
    eps: 1e-10
    weight_decay: 1e-4
  doma_param_groups:
    enabled: true
    weight_decay: 0.0
lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size:
  - 10
  - 25
