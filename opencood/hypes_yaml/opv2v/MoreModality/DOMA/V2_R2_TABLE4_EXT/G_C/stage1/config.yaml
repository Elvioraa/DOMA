# TABLE4_EXT_PROTOCOL_AUDIT: historical Row2 saved config is the fixed baseline.
# New rows only: G_C, M_C, G_Only, C_Only; no rerun of completed historical rows.
# Stage1 epochs=30; Stage2 epoches=25, historical init_epoch=1 (24 executed epochs).
# eval/save: m1=2/2, m2=1/1, m3=2/2, m4=2/2. Row3 differs: m2=2/2.
# Full DOMA: Stage2 epochs=30 and eval/save=1/1; final-result weight-selection provenance remains unverified.
# New checkpoint selection: unique validation-loss bestval, never test-AP selection.
# Physical GPUs=0,2; DDP world_size=2. See docs/DOMA_TABLE4_EXT.md for full audit.
name: DOMA_V2_R2_TABLE4_EXT_G_C_stage1
seed: 303
root_dir: dataset/OPV2V/train
validate_dir: dataset/OPV2V/validate
test_dir: dataset/OPV2V/test
yaml_parser: load_general_params
train_params:
  batch_size: 4
  epoches: 30
  eval_freq: 2
  save_freq: 2
  max_cav: 5
  ddp_safe_validation:
    enabled: true
comm_range: 70
input_source:
- lidar
label_type: lidar
cav_lidar_range: &id001
- -102.4
- -51.2
- -3
- 102.4
- 51.2
- 1
heter:
  assignment_path: opencood/logs/heter_modality_assign/opv2v_4modality.json
  ego_modality: m1
  mapping_dict:
    m1: m1
    m2: m1
    m3: m1
    m4: m1
  modality_setting:
    m1:
      sensor_type: lidar
      core_method: point_pillar
      preprocess:
        core_method: SpVoxelPreprocessor
        args:
          voxel_size: &id003
          - 0.4
          - 0.4
          - 4
          max_points_per_voxel: 32
          max_voxel_train: 32000
          max_voxel_test: 70000
        cav_lidar_range: *id001
fusion:
  core_method: intermediateheter
  dataset: opv2v
  args:
    proj_first: false
    grid_conf: None
    data_aug_conf: None
preprocess:
  core_method: SpVoxelPreprocessor
  args:
    voxel_size:
    - 0.4
    - 0.4
    - 4
    max_points_per_voxel: 1
    max_voxel_train: 1
    max_voxel_test: 1
  cav_lidar_range: *id001
postprocess:
  core_method: VoxelPostprocessor
  gt_range: *id001
  anchor_args:
    cav_lidar_range: *id001
    l: 3.9
    w: 1.6
    h: 1.56
    r: &id002
    - 0
    - 90
    feature_stride: 2
    num: 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.2
  order: hwl
  max_num: 150
  nms_thresh: 0.15
  dir_args: &id004
    dir_offset: 0.7853
    num_bins: 2
    anchor_yaw: *id002
model:
  core_method: doma_heter_pyramid_collab
  args:
    lidar_range: *id001
    supervise_single: true
    m1:
      core_method: point_pillar
      sensor_type: lidar
      encoder_args:
        voxel_size: *id003
        lidar_range: *id001
        pillar_vfe:
          use_norm: true
          with_distance: false
          use_absolute_xyz: true
          num_filters:
          - 64
        point_pillar_scatter:
          num_features: 64
      backbone_args:
        layer_nums:
        - 3
        layer_strides:
        - 2
        num_filters:
        - 64
      aligner_args:
        core_method: identity
    fusion_backbone:
      resnext: true
      layer_nums:
      - 3
      - 5
      - 8
      layer_strides:
      - 1
      - 2
      - 2
      num_filters:
      - 64
      - 128
      - 256
      upsample_strides:
      - 1
      - 2
      - 4
      num_upsample_filter:
      - 128
      - 128
      - 128
      anchor_number: 2
    shrink_header:
      kernal_size:
      - 3
      stride:
      - 1
      padding:
      - 1
      dim:
      - 256
      input_dim: 384
    in_head: 256
    anchor_number: 2
    dir_args: *id004
    doma:
      enabled: true
      version: v2
      ablation: true
      mode: stage1_anchor
      object_space:
        enabled: true
        roi:
          output_size: 5
          max_train_proposals: 128
          max_infer_proposals: 64
          chunk_size: 32
          min_coverage: 0.5
      object_adapter:
        enabled: true
        type: residual_1x1
        zero_init: true
      object_encoder:
        enabled: true
        embedding_dim: 128
        hidden_channels: 64
        pooled_size: 2
      geometry:
        enabled: true
        hidden_dim: 32
      refiner:
        enabled: true
        hidden_dim: 128
        yaw_mode: sin_cos_centered
        zero_init_output: true
      multi_granularity:
        enabled: false
      quality:
        enabled: false
      consensus:
        enabled: true
        mode: uniform_geometry_mean
        fallback_to_original: true
      training_proposals:
        source: gt_jitter
        include_gt: true
        jitters_per_gt: 1
        center_xy_std_rel: 0.1
        center_z_std_rel: 0.05
        log_size_std: 0.05
        yaw_std_deg: 5.0
        max_proposals: 128
      loss:
        object_loss_weight: 0.2
        individual_loss_weight: 1.0
        consensus_loss_weight: 1.0
        quality_loss_weight: 0.0
loss:
  core_method: doma_point_pillar_pyramid_loss
  args:
    pos_cls_weight: 2.0
    cls:
      type: SigmoidFocalLoss
      alpha: 0.25
      gamma: 2.0
      weight: 1.0
    reg:
      type: WeightedSmoothL1Loss
      sigma: 3.0
      codewise: true
      weight: 2.0
    dir:
      type: WeightedSoftmaxClassificationLoss
      weight: 0.2
      args: *id004
    depth:
      weight: 1.0
    pyramid:
      relative_downsample:
      - 1
      - 2
      - 4
      weight:
      - 0.4
      - 0.2
      - 0.1
optimizer:
  core_method: Adam
  lr: 0.002828
  args:
    eps: 1e-10
    weight_decay: 1e-4
  doma_param_groups:
    enabled: true
    weight_decay: 0.0
lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size:
  - 15
  - 25
