name: DOMA_V3_R2_stage2_m2
root_dir: "dataset/OPV2V/train"
validate_dir: "dataset/OPV2V/validate"
test_dir: "dataset/OPV2V/test"

yaml_parser: "load_general_params"
train_params:
  batch_size: &batch_size 4
  epoches: 25
  eval_freq: 2
  save_freq: 2
  max_cav: 5

comm_range: 70
input_source: ['camera', 'depth']
label_type: 'camera'
cav_lidar_range: &cav_lidar [-51.2, -51.2, -3, 51.2, 51.2, 1]
add_data_extension: ['bev_visibility.png']

heter:
  assignment_path: "opencood/logs/heter_modality_assign/opv2v_4modality.json"
  ego_modality: &ego_modality "m2"
  lidar_channels_dict:
    m3: 32
  mapping_dict:
    m1: m2
    m2: m2
    m3: m2
    m4: m2
  modality_setting:
    m2:
      sensor_type: &sensor_type_m2 'camera'
      core_method: &core_method_m2 "lift_splat_shoot"

      grid_conf: &grid_conf_m2
        xbound: [-51.2, 51.2, 0.4]   # metric BEV bounds
        xbound: [-51.2, 51.2, 0.4]   # metric BEV x bounds
        ybound: [-51.2, 51.2, 0.4]   # metric BEV y bounds
        zbound: [-10, 10, 20.0]      # metric BEV z bounds
        ddiscr: [2, 50, 48]
        zbound: [-10, 10, 20.0]   # metric BEV bounds
        ddiscr: [2, 50, 48]
        mode: 'LID'
      data_aug_conf: &data_aug_conf_m2
        resize_lim: [0.65, 0.7]
        final_dim: [384, 512]
        rot_lim: [-3.6, 3.6]
        H: 600
        W: 800
        rand_flip: False
        bot_pct_lim: [0.0, 0.05]
        cams: ['camera0', 'camera1', 'camera2', 'camera3']
        Ncams: 4


fusion:
  core_method: 'lateheter'
  dataset: 'opv2v'
  args:
    proj_first: false
    grid_conf: None # place-holder
    data_aug_conf: None # place-holder

data_augment: # no use in intermediate fusion
  - NAME: random_world_flip
    ALONG_AXIS_LIST: [ 'x' ]

  - NAME: random_world_rotation
    WORLD_ROT_ANGLE: [ -0.78539816, 0.78539816 ]

  - NAME: random_world_scaling
    WORLD_SCALE_RANGE: [ 0.95, 1.05 ]

preprocess:
  # options: BasePreprocessor, VoxelPreprocessor, BevPreprocessor
  core_method: 'SpVoxelPreprocessor'
  args:
    voxel_size: [0.4, 0.4, 4] # useful
    max_points_per_voxel: 1 # useless
    max_voxel_train: 1 # useless
    max_voxel_test: 1 # useless
  # lidar range for each individual cav.
  cav_lidar_range: *cav_lidar

# anchor box related
postprocess:
  core_method: 'VoxelPostprocessor' # VoxelPostprocessor, BevPostprocessor supported
  gt_range: *cav_lidar
  anchor_args:
    cav_lidar_range: *cav_lidar
    l: 3.9
    w: 1.6
    h: 1.56
    r: &anchor_yaw [0, 90]
    feature_stride: 2
    num: &anchor_num 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.2
  order: 'hwl' # hwl or lwh
  max_num: 150 # maximum number of objects in a single frame. use this number to make sure different frames has the same dimension in the same batch
  nms_thresh: 0.15
  dir_args: &dir_args
    dir_offset: 0.7853
    num_bins: 2
    anchor_yaw: *anchor_yaw

# model related
model:
  core_method: doma_heter_pyramid_single
  args:
    ego_modality: *ego_modality
    lidar_range: *cav_lidar
    fix_encoder: false

    m2:
      core_method: *core_method_m2
      sensor_type: *sensor_type_m2

      encoder_args:
        anchor_number: *anchor_num
        grid_conf: *grid_conf_m2
        data_aug_conf: *data_aug_conf_m2
        img_downsample: 8
        img_features: &img_feature 128
        use_depth_gt: false
        depth_supervision: true
        camera_encoder: EfficientNet

      camera_mask_args:
        cav_lidar_range: *cav_lidar
        grid_conf: *grid_conf_m2

      backbone_args:
        layer_nums: [3]
        layer_strides: [2]
        num_filters: [64]
        inplanes: 128

      aligner_args:
        core_method: convnext
        spatial_align: false
        args:
          num_of_blocks: 3
          dim: 64

    fusion_backbone:
      resnext: true
      layer_nums: [3, 5, 8]
      layer_strides: [1, 2, 2]
      num_filters: [64, 128, 256]
      upsample_strides: [1, 2, 4]
      num_upsample_filter: [128, 128, 128]
      anchor_number: *anchor_num

    shrink_header:
      kernal_size: [ 3 ]
      stride: [ 1 ]
      padding: [ 1 ]
      dim: [ 256 ]
      input_dim: 384 # 128 * 3

    in_head: 256

    anchor_number: *anchor_num
    dir_args: *dir_args

    doma:
      enabled: true
      version: v3
      ablation: false
      mode: stage2_adapt
      active_modality: m2
      object_space:
        enabled: true
        roi:
          output_size: 5
          max_train_proposals: 128
          max_infer_proposals: 64
          chunk_size: 32
          min_coverage: 0.5
      object_adapter:
        enabled: true
        type: residual_1x1
        zero_init: true
      object_encoder:
        enabled: true
        embedding_dim: 128
        hidden_channels: 64
        pooled_size: 2
      geometry:
        enabled: true
        hidden_dim: 32
      refiner:
        enabled: true
        hidden_dim: 128
        yaw_mode: sin_cos_centered
        zero_init_output: true
      multi_granularity:
        enabled: true
        detail:
          enabled: true
          roi_size: 5
        context:
          enabled: true
          roi_size: 3
        fusion:
          enabled: true
          type: concat_projection
      quality:
        enabled: true
        target: refined_iou
        hidden_dim: 64
        use_roi_coverage: true
        use_agent_distance: true
        detach_target: true
        detach_weight_for_consensus: true
      consensus:
        enabled: true
        mode: quality_weighted
        fallback_to_original: true
        min_quality_sum: 1.0e-6
        low_quality_fallback: uniform
      training_proposals:
        source: gt_jitter
        include_gt: true
        jitters_per_gt: 1
        center_xy_std_rel: 0.10
        center_z_std_rel: 0.05
        log_size_std: 0.05
        yaw_std_deg: 5.0
        max_proposals: 128
      loss:
        object_loss_weight: 0.2
        individual_loss_weight: 1.0
        consensus_loss_weight: 1.0
        quality_loss_weight: 0.05

loss:
  core_method: doma_point_pillar_pyramid_loss
  args:
    pos_cls_weight: 2.0
    cls:
      type: 'SigmoidFocalLoss'
      alpha: 0.25
      gamma: 2.0
      weight: 1.0
    reg:
      type: 'WeightedSmoothL1Loss'
      sigma: 3.0
      codewise: true
      weight: 2.0
    dir:
      type: 'WeightedSoftmaxClassificationLoss'
      weight: 0.2
      args: *dir_args
    depth:
      weight: 1.0
    pyramid:
      relative_downsample: [1, 2, 4]
      weight: [0.4, 0.2, 0.1]


optimizer:
  core_method: Adam
  lr: 0.001
  args:
    eps: 1e-10
    weight_decay: 1e-4
  doma_param_groups:
    enabled: true
    weight_decay: 0.0

lr_scheduler:
  core_method: multistep #step, multistep and Exponential support
  gamma: 0.1
  step_size: [10, 25]
